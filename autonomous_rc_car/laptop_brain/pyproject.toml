[build-system]
requires = ["setuptools>=64"]  # >=64 provides the PEP 660 build_editable hook (pip install -e)
build-backend = "setuptools.build_meta"

[project]
name = "rc-car-nav"
version = "0.1.0"
description = "Navigation algorithm library for the iPhone-brain RC car (occupancy grid, frontier exploration, A*, wire protocol). Pure-Python, hardware-free, ROS-free; wrapped by the ROS2 nodes."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "open3d",
    "pyyaml",       # calibration.yaml
]

[project.optional-dependencies]
viewer = ["opencv-python"]
dev = ["pytest"]

# Ship only the `nav` package as the importable library. The ROS2 package
# (ros2_ws/src/autonomous_rc_car_ros) depends on this and imports `nav.*`.
[tool.setuptools]
packages = ["nav"]
